name: Discord Notifications
on:
  push:
    branches:
      - '*'
  pull_request:
    types: [opened, closed, merged]

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord on Push
        if: github.event_name == 'push'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          args: |
            🚀 **New Push to Repository**
            
            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Author:** ${{ github.actor }}
            **Commit:** ${{ github.sha }}
            **Message:** ${{ github.event.head_commit.message }}
            **Compare:** ${{ github.event.compare }}
            
            📝 **Files Changed:** ${{ github.event.head_commit.added.length }} added, ${{ github.event.head_commit.modified.length }} modified, ${{ github.event.head_commit.removed.length }} removed

      - name: Notify Discord on Pull Request
        if: github.event_name == 'pull_request'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          args: |
            ${{ github.event.action == 'opened' && '🆕' || github.event.action == 'closed' && github.event.pull_request.merged == true && '✅' || github.event.action == 'closed' && '❌' }} **Pull Request ${{ github.event.action == 'opened' && 'Opened' || github.event.action == 'closed' && github.event.pull_request.merged == true && 'Merged' || github.event.action == 'closed' && 'Closed' }}**
            
            **Repository:** ${{ github.repository }}
            **PR #${{ github.event.number }}:** ${{ github.event.pull_request.title }}
            **Author:** ${{ github.event.pull_request.user.login }}
            **Branch:** ${{ github.event.pull_request.head.ref }} → ${{ github.event.pull_request.base.ref }}
            **URL:** ${{ github.event.pull_request.html_url }}
            
            ${{ github.event.pull_request.body && format('**Description:**\n```\n{0}\n```', github.event.pull_request.body) || '' }}

