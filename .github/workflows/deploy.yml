name: Deploy to VPS
on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "production"
        type: choice
        options:
          - production

env:
  DEPLOY_PATH: /opt/itp_system32
  DOCKER_REGISTRY: docker.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment directory and copy compose file
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            mkdir -p ${{ env.DEPLOY_PATH }}
          "
          scp compose.prod.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: Deploy application on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd ${{ env.DEPLOY_PATH }}
            
            # Set version from commit SHA (first 7 characters)
            VERSION=$(echo ${{ github.sha }} | cut -c1-7)
            
            # Set environment variables for compose
            export DOCKER_REGISTRY=${{ env.DOCKER_REGISTRY }}
            export BACKEND_VERSION=\$VERSION
            export FRONTEND_VERSION=\$VERSION
            
            # Pull latest images from registry (fallback to latest if version doesn't exist)
            if ! docker compose -f compose.prod.yml pull 2>/dev/null; then
              echo \"Version \$VERSION not found, using latest...\"
              export BACKEND_VERSION=latest
              export FRONTEND_VERSION=latest
              docker compose -f compose.prod.yml pull
            fi
            
            # Stop existing containers gracefully
            docker compose -f compose.prod.yml down || true
            
            # Start services
            docker compose -f compose.prod.yml up -d
            
            # Wait for database to be ready
            echo 'Waiting for services to be ready...'
            sleep 20
            
            # Run migrations
            docker compose -f compose.prod.yml exec -T backend python manage.py migrate --noinput || true
            
            echo 'Deployment completed successfully!'
          "

      - name: Verify deployment
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd ${{ env.DEPLOY_PATH }}
            
            # Check if containers are running and healthy
            docker compose -f compose.prod.yml ps
            
            # Check health status
            if docker compose -f compose.prod.yml ps | grep -q 'healthy\|Up'; then
              echo '✅ All services are running'
            else
              echo '❌ Some services failed to start'
              docker compose -f compose.prod.yml logs --tail=50
              exit 1
            fi
          "

      - name: Clean up old images
        if: success()
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            # Remove unused Docker images and containers to save space
            docker image prune -af --filter 'until=24h'
            docker system prune -f --volumes --filter 'until=24h'
          "

      - name: Notify Discord - Deployment Success
        if: success()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          args: |
            🚀 **Deployment Successful**

            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Environment:** ${{ github.event.inputs.environment || 'production' }}
            **Author:** ${{ github.actor }}
            **Commit:** ${{ github.sha }}

            🌐 **Services Deployed:**
            • Backend API
            • Frontend Application
            • Database

            🔗 **View Details:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Notify Discord - Deployment Failure
        if: failure()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          args: |
            ❌ **Deployment Failed**

            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Environment:** ${{ github.event.inputs.environment || 'production' }}
            **Author:** ${{ github.actor }}
            **Commit:** ${{ github.sha }}

            🔍 **Check the logs for more details**

            🔗 **View Details:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
