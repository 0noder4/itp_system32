name: Deploy to VPS
on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment directory on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            mkdir -p /opt/itp_system32
            cd /opt/itp_system32
          "

      - name: Copy files to VPS
        run: |
          scp -r . ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/itp_system32/

      - name: Deploy application on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd /opt/itp_system32
            
            # Stop existing containers
            docker-compose down || true
            
            # Pull latest images (if using registry)
            docker-compose pull || true
            
            # Build and start containers
            docker-compose up -d --build
            
            # Wait for services to be ready
            sleep 10
            
            # Check if services are running
            docker-compose ps
            
            # Optional: Run database migrations
            # docker-compose exec backend python manage.py migrate
            
            # Optional: Collect static files
            # docker-compose exec backend python manage.py collectstatic --noinput
            
            echo 'Deployment completed successfully!'
          "

      - name: Verify deployment
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd /opt/itp_system32
            
            # Check if containers are healthy
            if docker-compose ps | grep -q 'Up'; then
              echo '✅ All services are running'
              docker-compose ps
            else
              echo '❌ Some services failed to start'
              docker-compose ps
              docker-compose logs --tail=50
              exit 1
            fi
          "

      - name: Clean up old images
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            # Remove unused Docker images to save space
            docker image prune -f
            docker system prune -f
          "

      - name: Notify Discord - Deployment Success
        if: success()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          args: |
            🚀 **Deployment Successful**
            
            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Environment:** ${{ github.event.inputs.environment || 'production' }}
            **Author:** ${{ github.actor }}
            **Commit:** ${{ github.sha }}
            
            🌐 **Services Deployed:**
            • Backend API
            • Frontend Application
            • Database
            
            🔗 **View Details:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Notify Discord - Deployment Failure
        if: failure()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          args: |
            ❌ **Deployment Failed**
            
            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Environment:** ${{ github.event.inputs.environment || 'production' }}
            **Author:** ${{ github.actor }}
            **Commit:** ${{ github.sha }}
            
            🔍 **Check the logs for more details**
            
            🔗 **View Details:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
