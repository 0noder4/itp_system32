name: pipeline
on:
  push:
    branches:
      - develop
  workflow_dispatch:
jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup docker buildx
        uses: docker/setup-buildx-action@v2
      - name: docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build and publish backend image
        id: build-push-backend
        uses: docker/build-push-action@v3
        with:
          context: "{{defaultContext}}:backend"
          file: Dockerfile
          push: true
          tags: 0noder4/itp_system32_backend:dev_${{ github.run_number }}

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup docker buildx
        uses: docker/setup-buildx-action@v2
      - name: docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build and publish frontend image
        id: build-push-frontend
        uses: docker/build-push-action@v3
        with:
          context: "{{defaultContext}}:frontend"
          file: Dockerfile
          push: true
          tags: 0noder4/itp_system32_frontend:dev_${{ github.run_number }}

  notify-discord:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: always()
    steps:
      - name: Notify Discord - Build Success
        if: needs.build-backend.result == 'success' && needs.build-frontend.result == 'success'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          args: |
            ✅ **Build Pipeline Completed Successfully**
            
            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Author:** ${{ github.actor }}
            **Run Number:** #${{ github.run_number }}
            
            🐳 **Docker Images Built:**
            • Backend: `0noder4/itp_system32_backend:dev_${{ github.run_number }}`
            • Frontend: `0noder4/itp_system32_frontend:dev_${{ github.run_number }}`
            
            🔗 **View Details:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Notify Discord - Build Failure
        if: needs.build-backend.result == 'failure' || needs.build-frontend.result == 'failure'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          args: |
            ❌ **Build Pipeline Failed**
            
            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Author:** ${{ github.actor }}
            **Run Number:** #${{ github.run_number }}
            
            🔍 **Build Status:**
            • Backend: ${{ needs.build-backend.result == 'failure' && '❌ Failed' || '✅ Success' }}
            • Frontend: ${{ needs.build-frontend.result == 'failure' && '❌ Failed' || '✅ Success' }}
            
            🔗 **View Details:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
