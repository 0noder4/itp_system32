services:
  db:
    image: mysql:8.0
    container_name: ${PROJECT_NAME}_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
    env_file:
      - .env
    volumes:
      - data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - internal
  backend:
    image: 0noder4/itp_system32_backend:${BACKEND_VERSION}
    container_name: ${PROJECT_NAME}_backend
    build:
      context: backend
      target: ${ENV}
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DEBUG}
      DJANGO_LOGLEVEL: ${DJANGO_LOGLEVEL}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DATABASE_ENGINE: ${DATABASE_ENGINE}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-}
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - internal
    depends_on:
      - db
    volumes:
      - ./backend:/app
  scheduler:
    image: 0noder4/itp_system32_backend:${BACKEND_VERSION}
    container_name: ${PROJECT_NAME}_scheduler
    build:
      context: backend
      target: ${ENV}
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DEBUG}
      DJANGO_LOGLEVEL: ${DJANGO_LOGLEVEL}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DATABASE_ENGINE: ${DATABASE_ENGINE}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://localhost:8000}
      NOTIFICATIONS_HOUR: ${NOTIFICATIONS_HOUR:-9}
      NOTIFICATIONS_MINUTE: ${NOTIFICATIONS_MINUTE:-0}
    env_file:
      - .env
    networks:
      - internal
    depends_on:
      - db
    volumes:
      - ./backend:/app
    command: ["/bin/bash", "/app/docker-entrypoint-notifications.sh"]
    restart: unless-stopped
  frontend:
    image: 0noder4/itp_system32_frontend:${FRONTEND_VERSION}
    container_name: ${PROJECT_NAME}_frontend
    restart: on-failure
    build:
      context: frontend
      target: ${ENV}
      args:
        NODE_ENV: ${ENV}
        NEXT_PUBLIC_API_URL: ${API_URL}
    environment:
      NODE_ENV: ${ENV}
      NODE_TLS_REJECT_UNAUTHORIZED: 0
    env_file:
      - .env
    ports:
      - 3000:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - internal
    depends_on:
      - backend
  mailpit:
    image: axllent/mailpit
    container_name: ${PROJECT_NAME}_mailpit
    restart: unless-stopped
    volumes:
      - mailpit_data:/data
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_UI_AUTH: "${EMAIL_HOST_USER}:${EMAIL_HOST_PASSWORD}"
    networks:
      - internal

  backup:
    build:
      context: ./backups
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME}_backup
    restart: unless-stopped
    environment:
      DATABASE_HOST: ${DATABASE_HOST:-db}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: root
      DATABASE_PASSWORD: ${DATABASE_ROOT_PASSWORD}
      DATABASE_PORT: ${DATABASE_PORT:-3306}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_ON_START: ${BACKUP_ON_START:-false}
      TZ: ${TZ:-UTC}
    volumes:
      - backups:/backups
    networks:
      - internal
    depends_on:
      - db

volumes:
  mailpit_data:
  data:
  backups:
networks:
  internal:
